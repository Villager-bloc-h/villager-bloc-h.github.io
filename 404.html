<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · 这一块还没有被探索 — Villager-bloc-h</title>
  <meta name="description" content="页面不存在。回到 Villager-bloc-h 的主页继续探索。">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#080d0b" id="theme-color">
  <link rel="icon" href="/assets/Vbh.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/style.css">
  <script>
    (function () {
      var root = document.documentElement;
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('vbh-theme');
        theme = saved === 'light' || saved === 'dark' ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch (e) {}
      root.setAttribute('data-theme', theme);
      var meta = document.getElementById('theme-color');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f2e8' : '#080d0b');
    })();
  </script>
</head>
<body id="top">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Villager-bloc-h 首页">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Villager-bloc-h</span>
      </a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到浅色主题" title="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.2 14.1A8.4 8.4 0 0 1 9.9 3.8 8.5 8.5 0 1 0 20.2 14.1Z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="error-page" id="main">
    <div class="error-inner">
      <p class="error-code">404</p>
      <p class="error-kicker">CHUNK NOT FOUND</p>
      <h1>这一块还没有被探索</h1>
      <p class="error-message">页面可能被移动或删除了。回主页看看吧。</p>
      <div class="error-actions">
        <a class="btn btn-primary" href="/">回到主页</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>© <span id="year">2026</span> Villager-bloc-h</p>
      <p><a href="/LICENSE">MIT License</a> · GitHub Pages</p>
    </div>
  </footer>

  <script src="/assets/main.js" defer></script>
</body>
</html>
